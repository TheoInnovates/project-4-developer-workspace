name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compose-lint:
    name: Lint Docker Compose (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the target -> env/overlay/profiles mapping in scripts/deploy.sh
          - target: spark-d5dd
            env_example: .env.spark-d5dd.example
            overlay: docker-compose.spark-d5dd.yml
            profiles: dev,monitoring,storage,security,infra,nemotron,webui,search,ide,status
          - target: spark-06ad
            env_example: .env.spark-06ad.example
            overlay: docker-compose.spark-06ad.yml
            profiles: coder
          - target: devstack
            env_example: .env.cloud.example
            overlay: docker-compose.cloud.yml
            profiles: dev,monitoring,storage,security,infra
    steps:
      - uses: actions/checkout@v4
      - name: Build env file from example + placeholders for missing vars
        run: |
          grep -hoP '\$\{(\w+)\}' docker-compose.yml "${{ matrix.overlay }}" \
            | sort -u | sed 's/\${//;s/}//' > .env.vars
          while read -r var; do
            if ! grep -q "^${var}=" "${{ matrix.env_example }}"; then
              case "$var" in
                *PORT*)                   echo "${var}=8080" ;;
                *DIR*|*BASE*|*WORKSPACE*) echo "${var}=/tmp" ;;
                *)                        echo "${var}=placeholder" ;;
              esac
            fi
          done < .env.vars > .env.extra
          cat "${{ matrix.env_example }}" .env.extra > .env.ci
      - name: Validate compose config
        env:
          COMPOSE_PROFILES: ${{ matrix.profiles }}
        run: |
          docker compose -f docker-compose.yml -f "${{ matrix.overlay }}" \
            --env-file .env.ci config --quiet

  yaml-lint:
    name: Lint YAML configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            prometheus/prometheus.yml \
            prometheus/alertmanager.yml \
            prometheus/alerts/alerts.yml \
            loki/config.yml \
            grafana/provisioning/datasources/prometheus.yml \
            grafana/provisioning/dashboards/dashboards.yml \
            promtail/promtail.yml

  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  tofu-validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
      - name: Validate Terraform configs
        working-directory: infra
        run: |
          tofu init -backend=false
          tofu validate

  trivy-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
