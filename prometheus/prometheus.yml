global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: gitlab
    metrics_path: /-/metrics
    static_configs:
      - targets: ["gitlab:80"]

  - job_name: nexus
    metrics_path: /service/metrics/prometheus
    static_configs:
      - targets: ["nexus:8081"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["vault:8200"]

  # vLLM on Spark 1 (this host) — host network, reachable via the docker bridge gateway
  - job_name: vllm-nemotron
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  # vLLM on Spark 2 (remote) — reachable by Tailscale MagicDNS
  - job_name: vllm-coder
    metrics_path: /metrics
    static_configs:
      - targets: ["spark-06ad:8001"]
