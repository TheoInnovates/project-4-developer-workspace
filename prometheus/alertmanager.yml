# Alertmanager routing — receives alerts from Prometheus (see the `alerting:`
# block in prometheus.yml) and forwards them to a notification channel.
#
# Default receiver posts to an ntfy.sh topic: zero infrastructure, just pick a
# unique topic below and subscribe to it in the ntfy app or at
# https://ntfy.sh/<topic>. Topics are an unauthenticated public namespace, so
# treat the topic name as a secret. The generic webhook delivers the raw
# Alertmanager JSON payload; readable enough for a homelab, or swap in one of
# the commented receivers below.
route:
  receiver: ntfy
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: ntfy
    webhook_configs:
      - url: https://ntfy.sh/devhub-alerts-CHANGE-ME
        send_resolved: true

