# Loki config: the image's default local-config.yaml plus log retention.
# Mounted over /etc/loki/config.yml by docker-compose.yml.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention is enforced by the compactor (filesystem store has no lifecycle
# rules of its own). 30d matches Prometheus's --storage.tsdb.retention.time.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
