networks:
  devstack:
    name: devstack
    driver: bridge

services:
  # =========================================================================
  # Caddy - Reverse Proxy (caddy-docker-proxy, label-driven)
  # =========================================================================
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    networks:
      - devstack
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Base Caddyfile providing global options + the reusable (tls_certs) snippet
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - ${VOLUMES_BASE}/caddy-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      # Caddy has no web dashboard; the admin/metrics API is exposed on :2019
      homepage.group: Infrastructure
      homepage.name: Caddy
      homepage.icon: caddy
      homepage.href: ""
      homepage.description: Reverse Proxy & TLS

  # =========================================================================
  # GitLab CE - Source Control
  # =========================================================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    profiles: [dev]
    hostname: ${GITLAB_HOST}
    networks:
      - devstack
    ports:
      - "${GITLAB_SSH_PORT}:22"
    volumes:
      - ${VOLUMES_BASE}/gitlab-config:/etc/gitlab
      - ${VOLUMES_BASE}/gitlab-logs:/var/log/gitlab
      - ${VOLUMES_BASE}/gitlab-data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOST}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'

        # Use Caddy for TLS termination
        nginx['listen_port'] = 80
        nginx['listen_https'] = false

        # SSH config
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}

        # Performance tuning for local dev
        puma['workers'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        sidekiq['concurrency'] = 10

        # Disable built-in monitoring (using external Prometheus/Grafana)
        prometheus_monitoring['enable'] = false

        # Enable Prometheus metrics endpoint
        gitlab_rails['monitoring_whitelist'] = ['172.16.0.0/12']
    healthcheck:
      test: ["CMD-SHELL", "/opt/gitlab/embedded/bin/curl -sf http://localhost:80/-/health || /opt/gitlab/embedded/bin/curl -sf http://localhost:80/users/sign_in -o /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 6G
    shm_size: 256m
    labels:
      caddy: ${GITLAB_HOST}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Development
      homepage.name: GitLab
      homepage.icon: gitlab
      homepage.href: "https://${GITLAB_HOST}"
      homepage.description: Source Control & CI/CD

  # =========================================================================
  # GitLab Runner - CI/CD Executor
  # =========================================================================
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    profiles: [dev]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitlab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "gitlab-runner", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      homepage.group: Development
      homepage.name: GitLab Runner
      homepage.icon: gitlab
      homepage.href: "https://${GITLAB_HOST}/admin/runners"
      homepage.description: CI/CD Pipeline Executor

  # =========================================================================
  # Nexus Repository - Artifact Management
  # =========================================================================
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    profiles: [dev]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms512m
        -Xmx1536m
        -XX:MaxDirectMemorySize=512m
    labels:
      caddy: ${NEXUS_HOST}
      caddy.reverse_proxy: "{{upstreams 8081}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Development
      homepage.name: Nexus
      homepage.icon: nexus
      homepage.href: "https://${NEXUS_HOST}"
      homepage.description: Artifact Repository Manager

  # =========================================================================
  # Docker Registry
  # =========================================================================
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    profiles: [dev]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      caddy: ${REGISTRY_HOST}
      caddy.reverse_proxy: "{{upstreams 5000}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Development
      homepage.name: Registry
      homepage.icon: docker
      homepage.href: "https://${REGISTRY_HOST}"
      homepage.description: Docker Container Registry

  # =========================================================================
  # Prometheus - Metrics Collection
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    profiles: [monitoring]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - ${VOLUMES_BASE}/prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      caddy: ${PROMETHEUS_HOST}
      caddy.reverse_proxy: "{{upstreams 9090}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Monitoring
      homepage.name: Prometheus
      homepage.icon: prometheus
      homepage.href: "https://${PROMETHEUS_HOST}"
      homepage.description: Metrics & Alerting
      homepage.widget.type: prometheus
      homepage.widget.url: "http://prometheus:9090"

  # =========================================================================
  # Grafana - Metrics Visualization
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles: [monitoring]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://${GRAFANA_HOST}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      caddy: ${GRAFANA_HOST}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Monitoring
      homepage.name: Grafana
      homepage.icon: grafana
      homepage.href: "https://${GRAFANA_HOST}"
      homepage.description: Dashboards & Visualization
      homepage.widget.type: grafana
      homepage.widget.url: "http://grafana:3000"
      homepage.widget.username: "${GRAFANA_ADMIN_USER}"
      homepage.widget.password: "${GRAFANA_ADMIN_PASSWORD}"

  # =========================================================================
  # Loki - Log Aggregation
  # =========================================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    profiles: [monitoring]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    # No healthcheck: the loki image is distroless (no shell/wget/curl), so an
    # in-container HTTP probe can't run. Promtail's depends_on uses service_started.
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      homepage.group: Monitoring
      homepage.name: Loki
      homepage.icon: loki
      homepage.href: "https://${GRAFANA_HOST}/explore"
      homepage.description: Log Aggregation Engine

  # =========================================================================
  # Promtail - Log Collector
  # =========================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    profiles: [monitoring]
    networks:
      - devstack
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      # The promtail image has no wget/curl, but it does ship bash: probe /ready
      # over bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      homepage.group: Monitoring
      homepage.name: Promtail
      homepage.icon: loki
      homepage.href: "https://${GRAFANA_HOST}/explore"
      homepage.description: Log Collector Agent

  # =========================================================================
  # MinIO - Object Storage
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    profiles: [storage]
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      # Console UI
      caddy_0: ${MINIO_HOST}
      caddy_0.reverse_proxy: "{{upstreams 9001}}"
      caddy_0.import: tls_certs
      # S3 API
      caddy_1: ${MINIO_API_HOST}
      caddy_1.reverse_proxy: "{{upstreams 9000}}"
      caddy_1.import: tls_certs
      # Homepage
      homepage.group: Storage
      homepage.name: MinIO
      homepage.icon: minio
      homepage.href: "https://${MINIO_HOST}"
      homepage.description: S3-Compatible Object Storage

  # =========================================================================
  # Vault - Secret Management
  # =========================================================================
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    profiles: [security]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/vault-data:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    command: server
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      caddy: ${VAULT_HOST}
      caddy.reverse_proxy: "{{upstreams 8200}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Security
      homepage.name: Vault
      homepage.icon: vault
      homepage.href: "https://${VAULT_HOST}"
      homepage.description: Secret Management

  # =========================================================================
  # Portainer - Container Management
  # =========================================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    profiles: [infra]
    networks:
      - devstack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${VOLUMES_BASE}/portainer-data:/data
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      caddy: ${PORTAINER_HOST}
      caddy.reverse_proxy: "{{upstreams 9000}}"
      caddy.import: tls_certs
      # Homepage
      homepage.group: Infrastructure
      homepage.name: Portainer
      homepage.icon: portainer
      homepage.href: "https://${PORTAINER_HOST}"
      homepage.description: Container Management UI
      homepage.widget.type: portainer
      homepage.widget.url: "https://portainer:9443"
      homepage.widget.env: "2"

  # =========================================================================
  # Watchtower - Automatic Container Updates
  # =========================================================================
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - devstack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      homepage.group: Infrastructure
      homepage.name: Watchtower
      homepage.icon: watchtower
      homepage.href: ""
      homepage.description: Auto-updates containers daily at 4 AM

  # =========================================================================
  # Homepage - Dashboard
  # =========================================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - devstack
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_HOST}"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      caddy: ${HOMEPAGE_HOST}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.import: tls_certs
      # Homepage self-entry
      homepage.group: Infrastructure
      homepage.name: Homepage
      homepage.icon: homepage
      homepage.href: "https://${HOMEPAGE_HOST}"
      homepage.description: Service Dashboard

  # =========================================================================
  # vLLM - Inference (GPU, host-network, profile-gated per Spark)
  # =========================================================================
  vllm-nemotron:
    image: nvcr.io/nvidia/vllm:26.03-py3
    container_name: vllm-nemotron
    restart: unless-stopped
    profiles: [nemotron]
    network_mode: host
    ipc: host
    shm_size: "10.24g"
    environment:
      NEMOTRON_SUPER_MODEL: ${VLLM_NEMOTRON_MODEL}
      VLLM_API_KEY: ${VLLM_API_KEY}
    volumes:
      - ./scripts/vllm/start-nemotron.sh:/workspace/start.sh:ro
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
    command: bash /workspace/start.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      homepage.group: Inference
      homepage.name: Nemotron Super 49B
      homepage.icon: nvidia
      homepage.href: "http://${VLLM_NEMOTRON_HREF_HOST:-localhost}:${VLLM_NEMOTRON_PORT:-8001}"
      homepage.description: "vLLM serving ${VLLM_NEMOTRON_MODEL:-}"

  vllm-coder:
    image: nvcr.io/nvidia/vllm:26.03-py3
    container_name: vllm-coder
    restart: unless-stopped
    profiles: [coder]
    network_mode: host
    ipc: host
    shm_size: "10.24g"
    environment:
      CODER_MAIN_MODEL: ${VLLM_CODER_MODEL}
      VLLM_API_KEY: ${VLLM_API_KEY}
    volumes:
      - ./scripts/vllm/start-coder.sh:/workspace/start.sh:ro
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
    command: bash /workspace/start.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      homepage.group: Inference
      homepage.name: Qwen3-Coder-Next
      homepage.icon: qwen
      homepage.href: "http://${VLLM_CODER_HREF_HOST:-localhost}:${VLLM_CODER_PORT:-8001}"
      homepage.description: "vLLM serving ${VLLM_CODER_MODEL:-}"

  # =========================================================================
  # OpenWebUI - Chat frontend for the vLLM endpoints
  # =========================================================================
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    profiles: [webui]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/openwebui-data:/app/backend/data
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Devstack}
      WEBUI_URL: "https://${OPENWEBUI_HOST}"
      OPENAI_API_BASE_URLS: ${OPENWEBUI_API_BASE_URLS}
      OPENAI_API_KEYS: ${OPENWEBUI_API_KEYS}
      ENABLE_RAG_WEB_SEARCH: ${ENABLE_RAG_WEB_SEARCH:-false}
      RAG_WEB_SEARCH_ENGINE: ${RAG_WEB_SEARCH_ENGINE:-searxng}
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&format=json"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      caddy: ${OPENWEBUI_HOST}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.import: tls_certs
      homepage.group: Inference
      homepage.name: OpenWebUI
      homepage.icon: open-webui
      homepage.href: "https://${OPENWEBUI_HOST}"
      homepage.description: Chat frontend across local vLLM models

  # =========================================================================
  # SearXNG - Private metasearch (web search backend for OpenWebUI RAG)
  # =========================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    profiles: [search]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: "https://${SEARXNG_HOST}/"
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      INSTANCE_NAME: ${WEBUI_NAME:-Devstack}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ -O /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      caddy: ${SEARXNG_HOST}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.import: tls_certs
      homepage.group: Apps
      homepage.name: SearXNG
      homepage.icon: searxng
      homepage.href: "https://${SEARXNG_HOST}"
      homepage.description: Private metasearch (also feeds OpenWebUI RAG)

  # =========================================================================
  # code-server - VS Code in the browser
  # =========================================================================
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    profiles: [ide]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/code-server-config:/config
      - ${CODESERVER_WORKSPACE:-/home/tforrester/projects}:/config/workspace
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      PASSWORD: ${CODESERVER_PASSWORD}
      SUDO_PASSWORD: ${CODESERVER_SUDO_PASSWORD:-}
      DEFAULT_WORKSPACE: /config/workspace
      PROXY_DOMAIN: ${CODESERVER_HOST}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8443/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      caddy: ${CODESERVER_HOST}
      caddy.reverse_proxy: "{{upstreams 8443}}"
      caddy.import: tls_certs
      homepage.group: Development
      homepage.name: code-server
      homepage.icon: vscode
      homepage.href: "https://${CODESERVER_HOST}"
      homepage.description: VS Code in the browser

  # =========================================================================
  # Uptime Kuma - Self-hosted status / uptime monitor
  # =========================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    profiles: [status]
    networks:
      - devstack
    volumes:
      - ${VOLUMES_BASE}/uptime-kuma:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      caddy: ${UPTIME_HOST}
