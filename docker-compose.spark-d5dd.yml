# Spark 1 (spark-d5dd) overrides: dev stack + Nemotron co-tenant on ARM64 Ubuntu
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.spark-d5dd.yml \
#     --env-file .env.spark-d5dd up -d

services:
  # Caddy bound to this host's Tailscale IP only — reachable from the tailnet
  # (via Route53 *.devhub.ninja -> ${TAILSCALE_IP}) but not the LAN/public.
  # !override replaces the base 0.0.0.0 binding instead of merging with it
  # (otherwise Caddy tries to bind both and collides on the port).
  caddy:
    ports: !override
      - "${TAILSCALE_IP}:80:80"
      - "${TAILSCALE_IP}:443:443"

  # GitLab — heavier limit since the Spark has plenty of RAM
  gitlab:
    deploy:
      resources:
        limits:
          memory: 8G

  # Nexus benefits from JVM headroom on ARM
  nexus:
    deploy:
      resources:
        limits:
          memory: 3G

  # Prometheus with extra room for the vLLM scrape targets, and DNS for both Sparks
  prometheus:
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach vllm-nemotron on this host's network namespace
      - "spark-06ad:192.168.100.10"           # reach vllm-coder over LAN (LAN HEAD_IP from old cortex-worker.yml)
    deploy:
      resources:
        limits:
          memory: 768M

  # OpenWebUI needs the same DNS escape hatches to reach both vLLM endpoints
  openwebui:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "spark-06ad:192.168.100.10"
