api:
  dashboard: true
  insecure: false

ping:
  entryPoint: websecure

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: devstack
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

metrics:
  prometheus:
    entryPoint: metrics
